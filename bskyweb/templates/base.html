<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="origin-when-cross-origin">
  <!--
    Preconnect to essential domains
  -->
  <link rel="preconnect" href="https://bsky.social">
  <link rel="preconnect" href="https://go.bsky.app">
  <title>{%- block head_title -%}{{ appName }}{%- endblock -%}</title>

  <!-- Hello Humans! API docs at https://atproto.com -->

  {% include "fonts.html" %}

  <style>
    /**
     * Minimum styles required to render splash.
     *
     * ALL OTHER STYLES BELONG IN `src/style.css`
     *
     * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
     */
    html,
    body {
      margin: 0px;
      padding: 0px;
      font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      /* Platform-specific reset */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
      font-synthesis-weight: none;
    }
    :root {
      --text: #221b00;
      --background: #f6f0e7;
      --backgroundLight: #e8e2d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --text: #fefbfb;
        --background: #1d1b16;
        --backgroundLight: #282520;
      }
    }
    html,
    body,
    #root {
      display: flex;
      flex: 1 0 auto;
      min-height: 100dvh;
      width: 100%;
    }
    html.theme--light {
        color-scheme: light;
      background-color: #f6f0e7;
      --text: #221b00;
      --background: #f6f0e7;
      --backgroundLight: #e8e2d9;
    }
    html.theme--dark {
      color-scheme: dark;
      background-color: #1d1b16;
      --text: #fefbfb;
      --background: #1d1b16;
      --backgroundLight: #282520;
    }
    html.theme--dim {
      color-scheme: dark;
      background-color: #1d1b16;
      --text: #fefbfb;
      --background: #1d1b16;
      --backgroundLight: #282520;
    }
    #splash {
      display: flex;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      align-items: center;
      justify-content: center;
    }
    #splash svg {
      position: relative;
      top: -50px;
      width: 100px;
    }
    /**
     * We need these styles to prevent shifting due to scrollbar show/hide on
     * OSs that have them enabled by default. This also handles cases where the
     * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
     * shift the content, by forcing the page to show a scrollbar.
     */
    body {
      width: 100%;
      overflow-y: scroll;
    }
  </style>
  <style>html, body, #root { background-color: var(--background); }</style>
  <meta name="theme-color" content="#f6f0e7">
  <script>
    try {
      const theme = localStorage.getItem('ALF_THEME')
      if (['light', 'dark', 'dim'].includes(theme)) document.documentElement.classList.add(`theme--${theme}`)
      const cached = JSON.parse(localStorage.getItem('WITCHSKY_SPLASH') || 'null')
      const mode = cached?.mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : cached?.mode
      const saved = cached?.[mode]
      if (saved && ['light', 'dark'].includes(saved.scheme) &&
          [saved.background, saved.text, saved.surface].every(color => typeof color === 'string' && /^#[0-9a-f]{6}$/i.test(color))) {
        const style = document.documentElement.style
        style.setProperty('--background', saved.background)
        style.setProperty('--text', saved.text)
        style.setProperty('--backgroundLight', saved.surface)
        if (typeof saved.accent === 'string' && /^#[0-9a-f]{6}$/i.test(saved.accent)) {
          style.setProperty('--splash-logo', saved.accent)
        }
        style.colorScheme = saved.scheme
        style.backgroundColor = saved.background
      }
    } catch {}
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--background').trim())
  </script>

  <link rel="manifest" href="/pwa/manifest.webmanifest">
  {% if featureGateBootstrap %}
  <script id="bsky-app-config" type="application/json">{{ featureGateBootstrap|safe }}</script>
  {% endif %}
  {% include "scripts.html" %}
  <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ staticCDNHost }}/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ staticCDNHost }}/static/favicon-16x16.png">
  <link rel="mask-icon" href="{{ staticCDNHost }}/static/safari-pinned-tab.svg" color="#6E5D0E">
  <meta name="application-name" content="{{ appName }}">
  <meta name="generator" content="bskyweb">
  {% if noindex %}<meta name="robots" content="noindex{% if nofollow %}, nofollow{% endif %}">{% endif %}
  <meta property="og:site_name" content="{{ appName }}">
  <meta property="og:logo" content="{{ favicon }}">
  <meta name="twitter:site" content="@bluesky" />
  <link type="application/activity+json" href="" />

  {% block html_head_extra -%}{%- endblock %}
</head>
<body>
{%- block body_all %}
  <div id="splash">
    <!--
      Brand mark: a rounded copy of MARK_PATH in src/view/icons/mark.ts,
      inlined so it paints before the bundle loads. Regenerate from MARK_PATH
      (SVGO, floatPrecision 0) if the mark changes.
    -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="var(--splash-logo, #887526)" d="M80 314A176 150 0 1 1 432 314A176 150 0 1 1 80 314ZM81.4 294.9L107 124.9Q118 52 158.1 136.3L236 300ZM276 300L353.9 136.3Q394 52 405 124.9L430.6 294.9Z"/></svg>
  </div>
  <div id="root">
  </div>

  <noscript>
    {% block noscript_extra %}{% endblock %}
    <div data-nosnippet>
      <p lang="en">Enable JavaScript to use {{ appName }}.</p>
      <p lang="en">Learn more about Bluesky at <a href="https://bsky.social">bsky.social</a> and <a href="https://atproto.com">atproto.com</a>.</p>
    </div>
  </noscript>
{% endblock -%}
</body>
</html>
